<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#232420">
<title>Bancolombia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700;800&family=Open+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --font: "Nunito Sans", "Avenir Next", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
    --splash-bg: #232420;
    --home-bg: #3d3943;
    --card-bg: #48444f;
    --tile-bg: #4a4651;
    --text: #f3f1f5;
    --muted: #cfcbd4;
    --yellow: #fdda24;
    --cyan: #4bc6e2;
    --orange: #f2643a;
    --ratio: 0.462; /* ancho / alto del teléfono */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: var(--font);
    background: #0e0e10;
    color: var(--text);
    display: grid;
    place-items: center;
    overflow: hidden;
  }

  /* ---------- Página (sin marco de teléfono) ---------- */
  body { background: var(--splash-bg); transition: background .6s ease; }
  body.ready { background: linear-gradient(180deg, #47424e 0%, var(--home-bg) 40%, #37333d 100%); }
  .stage { width: 100%; height: 100%; display: flex; justify-content: center; }
  .device {
    --w: min(100vw, 480px);             /* límite de ancho en pantallas grandes */
    --u: calc(var(--w) / 390);          /* unidad de escala: 1u = 1px a 390px de ancho */
    width: var(--w); height: 100dvh; position: relative;
  }
  .screen { position: relative; width: 100%; height: 100%; overflow: hidden; background: var(--splash-bg); isolation: isolate; }

  /* ---------- Splash ---------- */
  .splash {
    position: absolute; inset: 0; z-index: 30;
    background: #fdfdfb;
    animation: splashBg .5s .25s ease forwards;
    transition: opacity .6s ease, transform .6s ease, filter .6s ease;
    overflow: hidden;
  }
  @keyframes splashBg { to { background: var(--splash-bg); } }
  .splash.out { opacity: 0; transform: scale(1.08); filter: blur(6px); pointer-events: none; }

  .logo {
    display: inline-flex; align-items: center; gap: .1em;
    font-weight: 800; letter-spacing: -.035em; line-height: 1; color: #fff;
  }
  .logo svg { height: 1em; width: 1.02em; display: block; fill: currentColor; }
  .splash .logo {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    font-size: calc(32 * var(--u));
    opacity: 0; animation: fadeIn .5s .35s ease forwards;
  }
  @keyframes fadeIn { to { opacity: 1; } }

  .pct {
    position: absolute; left: 0; right: 0; bottom: calc(46 * var(--u));
    text-align: center; font-size: calc(13 * var(--u)); font-weight: 700; color: #fff;
    opacity: 0; animation: fadeIn .3s .45s ease forwards;
    font-variant-numeric: tabular-nums;
  }

  .swoosh { position: absolute; inset: 0; width: 100%; height: 100%; }
  .swoosh path { fill: none; stroke-linecap: round; }
  .swoosh .dash { stroke-dasharray: 0 400; stroke-dashoffset: 0; opacity: 0; }

  /* cian: punto apagado arriba-izquierda que se enciende y se estira en diagonal */
  .s-cyan   { animation: cyan 1.5s .85s cubic-bezier(.45,.05,.35,1) forwards; }
  /* naranja: esquina superior izquierda, detrás del cian */
  .s-orange1{ animation: grow 1.1s 1.45s cubic-bezier(.45,.05,.35,1) forwards; --len: 62; }
  /* amarillo: entra por el borde derecho y baja en curva */
  .s-yellow { animation: grow 1.3s 1.60s cubic-bezier(.4,.05,.3,1) forwards; --len: 96; }
  .s-orange2{ animation: grow .6s 2.15s ease-out forwards; --len: 100; }
  .s-dot    { animation: pop .3s 2.30s ease-out forwards; }

  @keyframes cyan {
    0%   { opacity: 1; stroke: #2e3c43; stroke-dasharray: 0 400; }
    28%  { opacity: 1; stroke: #2e3c43; stroke-dasharray: 0 400; }
    45%  { opacity: 1; stroke: var(--cyan); stroke-dasharray: 0 400; }
    60%  { opacity: 1; stroke-dasharray: 22 400; stroke-dashoffset: 0; }
    100% { opacity: 1; stroke: var(--cyan); stroke-dasharray: 88 400; stroke-dashoffset: -6; }
  }
  @keyframes grow {
    0%   { opacity: 1; stroke-dasharray: 0 400; }
    100% { opacity: 1; stroke-dasharray: var(--len) 400; }
  }
  @keyframes pop { from { opacity: 0; } to { opacity: 1; } }

  /* ---------- Home ---------- */
  .home {
    --u: calc(var(--w) / 762);            /* la referencia está medida a 762 px de ancho */
    position: absolute; inset: 0; z-index: 10;
    background: linear-gradient(180deg, #47424e 0%, var(--home-bg) 40%, #37333d 100%);
    display: flex; flex-direction: column;
    opacity: 0; transform: scale(.96);
    transition: opacity .7s ease, transform .7s cubic-bezier(.2,.7,.2,1);
  }
  .home.in { opacity: 1; transform: none; }
  .home button { font-family: var(--font); color: inherit; }
  .scroll {
    flex: 1; overflow-y: auto; overflow-x: hidden; scrollbar-width: none;
    padding: calc(73 * var(--u)) 0 calc(40 * var(--u));
    position: relative;
  }
  .scroll::-webkit-scrollbar { display: none; }
  @media all {
    .scroll { padding-top: calc(env(safe-area-inset-top, 0px) + 16 * var(--u)); }
  }

  .top { display: flex; align-items: center; justify-content: space-between; padding: 0 calc(30 * var(--u)) 0 calc(34 * var(--u)); height: calc(90 * var(--u)); }
  .top .logo { font-size: calc(50 * var(--u)); }
  .top .icons { display: flex; gap: calc(34 * var(--u)); }
  .ico { width: calc(54 * var(--u)); height: calc(54 * var(--u)); stroke: #fff; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

  .hello-row { position: relative; padding: calc(34 * var(--u)) calc(28 * var(--u)) 0; height: calc(34 * var(--u) + 56 * var(--u)); }
  .hello { font-size: calc(43 * var(--u)); line-height: calc(56 * var(--u)); font-weight: 600; letter-spacing: -.01em; white-space: nowrap; }

  .login {
    position: absolute; right: calc(52 * var(--u)); top: calc(107 * var(--u)); z-index: 3;
    display: flex; align-items: center; justify-content: space-between; gap: calc(10 * var(--u));
    width: calc(237 * var(--u)); height: calc(55 * var(--u));
    padding: 0 calc(16 * var(--u)) 0 calc(28 * var(--u));
    border-radius: 999px; border: 0;
    background: rgba(246,243,248,.9); color: #8e8a93 !important;
    font: 600 calc(21 * var(--u)) var(--font); cursor: pointer;
  }
  .login svg { width: calc(30 * var(--u)); height: calc(30 * var(--u)); stroke: #8e8a93; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .login:active { transform: scale(.98); }

  .arc { position: absolute; right: 0; top: calc(99 * var(--u)); width: calc(242 * var(--u)); height: calc(190 * var(--u)); pointer-events: none; z-index: 2; overflow: visible; }
  .arc path { fill: none; stroke-linecap: round; }

  .dyn {
    margin: calc(75 * var(--u)) calc(28 * var(--u)) 0;
    width: calc(327 * var(--u)); height: calc(100 * var(--u));
    display: flex; align-items: center; gap: calc(22 * var(--u));
    padding: 0 calc(20 * var(--u)) 0 calc(14 * var(--u));
    background: rgba(86,80,95,.55); border: 1px solid rgba(255,255,255,.07);
    border-radius: 999px; position: relative; cursor: pointer; text-align: left;
  }
  .dyn .ring { position: relative; width: calc(66 * var(--u)); height: calc(66 * var(--u)); flex: none; border-radius: 50%; display: grid; place-items: center; }
  .dyn .ring svg.timer { position: absolute; inset: 0; transform: rotate(-90deg); }
  .dyn .ring svg.lock { width: calc(30 * var(--u)); height: calc(30 * var(--u)); stroke: #e9e6ee; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  .dyn .lbl { display: block; font-size: calc(20 * var(--u)); color: var(--muted); font-weight: 600; }
  .dyn .code { display: block; font-size: calc(30 * var(--u)); font-weight: 800; letter-spacing: .02em; font-variant-numeric: tabular-nums; margin-top: calc(4 * var(--u)); }
  .dyn .chev { margin-left: auto; width: calc(24 * var(--u)); height: calc(24 * var(--u)); stroke: #e9e6ee; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  h2.sec { font-size: calc(26 * var(--u)); font-weight: 600; margin: calc(48 * var(--u)) calc(28 * var(--u)) calc(30 * var(--u)); letter-spacing: -.005em; }
  .dyn + h2.sec { margin-top: calc(66 * var(--u)); }

  .tx-row { display: flex; gap: calc(13 * var(--u)); overflow-x: auto; padding: 0 calc(28 * var(--u)); scrollbar-width: none; scroll-snap-type: x proximity; }
  .tx-row::-webkit-scrollbar { display: none; }
  .tx {
    flex: none; width: calc(150 * var(--u)); height: calc(147 * var(--u)); scroll-snap-align: start;
    background: var(--tile-bg); border-radius: calc(20 * var(--u)); border: 0; color: var(--text);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: calc(14 * var(--u));
    font: 600 calc(19 * var(--u))/1.2 var(--font); text-align: center; cursor: pointer;
    transition: transform .15s ease, background .15s ease;
  }
  .tx:active { transform: scale(.96); background: #55505d; }
  .tx svg { width: calc(50 * var(--u)); height: calc(50 * var(--u)); stroke: #e9e6ee; fill: none; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
  .tx .bre { font-size: calc(26 * var(--u)); font-weight: 800; letter-spacing: -.06em; height: calc(50 * var(--u)); display: grid; place-items: center; }

  .grid-card {
    margin: 0 calc(27 * var(--u)); padding: calc(26 * var(--u)) calc(8 * var(--u)) calc(34 * var(--u));
    background: rgba(255,255,255,.05); border-radius: calc(30 * var(--u));
    display: grid; grid-template-columns: repeat(3, 1fr); row-gap: calc(30 * var(--u));
  }
  .opt { display: flex; flex-direction: column; align-items: center; gap: calc(12 * var(--u)); background: none; border: 0; cursor: pointer; font: 600 calc(19 * var(--u))/1.2 var(--font); text-align: center; }
  .opt .dot { width: calc(110 * var(--u)); height: calc(110 * var(--u)); border-radius: 50%; display: grid; place-items: center; transition: transform .15s ease; }
  .opt:active .dot { transform: scale(.94); }
  .opt .dot svg { width: calc(54 * var(--u)); height: calc(54 * var(--u)); stroke: rgba(255,255,255,.78); fill: none; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
  .c1 { background: #f2b4d6; } .c2 { background: #b98be8; } .c3 { background: #72d3b2; }
  .c4 { background: #f4cf4d; } .c5 { background: #f39a6c; } .c6 { background: #9fd0ef; }

  .qr {
    position: absolute; right: calc(22 * var(--u)); bottom: calc(176 * var(--u)); z-index: 6;
    width: calc(110 * var(--u)); height: calc(110 * var(--u)); border-radius: 50%;
    background: rgba(58,54,65,.92); border: calc(6 * var(--u)) solid var(--yellow);
    display: grid; place-items: center; cursor: pointer; box-shadow: 0 6px 18px rgba(0,0,0,.35);
    transition: transform .15s ease;
  }
  .qr svg { width: calc(56 * var(--u)); height: calc(56 * var(--u)); stroke: #e9e6ee; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .qr:active { transform: scale(.94); }
  @media all { .qr { bottom: calc(176 * var(--u) + env(safe-area-inset-bottom, 0px)); } }

  .nav { flex: none; display: grid; grid-template-columns: repeat(5, 1fr); height: calc(155 * var(--u)); background: #3b3741; }
  @media all { .nav { height: calc(155 * var(--u) + env(safe-area-inset-bottom, 0px)); padding-bottom: env(safe-area-inset-bottom, 0px); } }
  .nav button { background: none; border: 0; font: 600 calc(19 * var(--u))/1.2 var(--font); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: calc(10 * var(--u)); cursor: pointer; padding: 0 calc(2 * var(--u)); color: var(--text); }
  .nav button svg { width: calc(56 * var(--u)); height: calc(56 * var(--u)); stroke: #e9e6ee; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .nav button.active { background: var(--yellow); color: #9b8a16; }
  .nav button.active svg { stroke: #9b8a16; }


  /* ---------- Inicio de sesión (medido sobre la captura de 306 x 623) ---------- */
  .auth {
    --u: calc(var(--w) / 306);
    position: absolute; inset: 0; z-index: 20; overflow: hidden;
    font-family: "Open Sans", "Segoe UI", system-ui, sans-serif;
    background: #555651; color: #fff;
    transform: translateX(100%); visibility: hidden;
    transition: transform .5s cubic-bezier(.22,.8,.2,1), visibility 0s .5s;
  }
  .auth.open { transform: none; visibility: visible; transition-delay: 0s; }
  .auth > * { position: absolute; }
  .auth button, .auth input { font-family: inherit; color: inherit; }
  .auth .bar { top: calc(14 * var(--u)); left: 0; right: 0; height: calc(28 * var(--u)); }
  .auth .bar button { position: absolute; top: 0; height: 100%; background: none; border: 0; display: flex; align-items: center; cursor: pointer; }
  .auth .bar svg { fill: none; stroke: #fff; stroke-linecap: round; stroke-linejoin: round; }
  #authClose { left: calc(8 * var(--u)); gap: calc(4 * var(--u)); font-size: calc(13 * var(--u)); font-weight: 700; }
  #authClose svg { width: calc(18 * var(--u)); height: calc(18 * var(--u)); stroke-width: 2.2; }
  #authNext { right: calc(10 * var(--u)); gap: calc(9 * var(--u)); font-size: calc(13.5 * var(--u)); font-weight: 400; }
  #authNext svg { width: calc(10 * var(--u)); height: calc(18 * var(--u)); stroke-width: 1.8; }
  .auth .bar .mark { position: absolute; left: 50%; top: 0; width: calc(27 * var(--u)); height: calc(25 * var(--u)); margin-left: calc(-13.5 * var(--u)); fill: #fff; stroke: none; }
  .auth h2 { top: calc(56 * var(--u)); left: 0; right: 0; text-align: center; font-size: calc(19.5 * var(--u)); font-weight: 800; line-height: calc(28 * var(--u)); }
  .auth-card { top: calc(127 * var(--u)); left: calc(12 * var(--u)); width: calc(281 * var(--u)); height: calc(91 * var(--u)); background: #6b6e71; border-radius: calc(6 * var(--u)); }
  .field { position: absolute; left: calc(10 * var(--u)); right: calc(11 * var(--u)); top: calc(16 * var(--u)); height: calc(50 * var(--u)); display: flex; align-items: center; gap: calc(10 * var(--u)); padding: 0 calc(12 * var(--u)) 0 calc(14 * var(--u)); border: calc(2 * var(--u)) solid #fff; border-radius: calc(6 * var(--u)); box-shadow: 0 0 calc(3 * var(--u)) rgba(255,255,255,.35); transition: box-shadow .2s; }
  .field:focus-within { box-shadow: 0 0 0 calc(2 * var(--u)) rgba(255,255,255,.35); }
  .field svg { width: calc(16 * var(--u)); height: calc(16 * var(--u)); flex: none; stroke: #fff; fill: none; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
  .field input { flex: 1; min-width: 0; background: none; border: 0; outline: 0; font-size: calc(13.5 * var(--u)); font-weight: 600; }
  .field input::placeholder { color: #fff; opacity: 1; }
  .go { top: calc(246 * var(--u)); left: calc(11 * var(--u)); width: calc(283 * var(--u)); height: calc(39 * var(--u)); border: 0; border-radius: 999px; background: #cdcfcf; color: #8d8f91 !important; font-size: calc(14 * var(--u)); font-weight: 600; cursor: default; transition: background .25s, color .25s, transform .15s; }
  .go.ready { background: #fff; color: #333 !important; cursor: pointer; }
  .go.ready:active { transform: scale(.98); }
  .auth a { left: 0; right: 0; text-align: center; font-size: calc(11.5 * var(--u)); font-weight: 700; color: #fff; text-decoration: underline; text-underline-offset: calc(2 * var(--u)); line-height: calc(16 * var(--u)); }
  .auth .forgot { top: calc(308 * var(--u)); }
  .auth .noacct { top: calc(505 * var(--u)); }
  .auth-wave { top: 0; left: 0; width: 100%; height: calc(623 * var(--u)); overflow: visible; pointer-events: none; }
  .auth-wave path { fill: none; }
  .finger { left: 50%; top: calc(355 * var(--u)); width: calc(118 * var(--u)); height: calc(118 * var(--u)); margin-left: calc(-59 * var(--u)); border-radius: 50%; border: 0; background: #6b6d70; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: calc(7 * var(--u)); font-size: calc(11.5 * var(--u)); font-weight: 600; cursor: pointer; transition: transform .15s; }
  .finger:active { transform: scale(.95); }
  .finger svg { width: calc(44 * var(--u)); height: calc(44 * var(--u)); overflow: visible; stroke: #fff; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; margin-top: calc(-6 * var(--u)); }
  .home { transition: opacity .7s ease, transform .5s cubic-bezier(.22,.8,.2,1); }
  .home.dim { transform: translateX(-28%); }

  /* ---------- Cuenta (sesión iniciada) — medido sobre la captura (~327 px de ancho) ---------- */
  .dash {
    --k: calc(var(--w) / 327);
    position: absolute; inset: 0; z-index: 25; display: flex; flex-direction: column;
    font-family: "Open Sans", "Segoe UI", system-ui, sans-serif; color: #ece9f0;
    background: linear-gradient(180deg, #3f3b47 0%, #3d3643 45%, #382f3f 100%);
    opacity: 0; visibility: hidden; transform: scale(1.04);
    transition: opacity .5s ease, transform .5s cubic-bezier(.2,.7,.2,1), visibility 0s .5s;
  }
  .dash.in { opacity: 1; visibility: visible; transform: none; transition-delay: 0s; }
  .dash :where(button) { font-family: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  .dash .sc { flex: 1; overflow-y: auto; overflow-x: hidden; scrollbar-width: none; position: relative; }
  .dash .sc::-webkit-scrollbar { display: none; }
  .dash .inner { position: relative; height: calc(830 * var(--k)); }
  .dash .inner > * { position: absolute; }
  .dash svg { fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .dash .logo svg { fill: currentColor; stroke: none; width: 1.02em; height: 1em; }

  .d-top { top: calc(env(safe-area-inset-top, 0px) + 0px); left: calc(12 * var(--k)); right: calc(10 * var(--k)); height: calc(50 * var(--k)); display: flex; align-items: center; justify-content: space-between; }
  .d-top .logo { font-family: var(--font); font-size: calc(17.5 * var(--k)); color: #fff; }
  .d-top .icons { display: flex; gap: calc(15 * var(--k)); align-items: center; }
  .d-top .icons button { width: calc(24 * var(--k)); height: calc(26 * var(--k)); padding: 0; display: grid; place-items: center; }
  .d-top .icons svg { width: calc(24 * var(--k)); height: calc(24 * var(--k)); stroke: #f3f1f5; stroke-width: 1.5; }
  .d-hello { top: calc(58 * var(--k)); left: calc(11 * var(--k)); right: calc(40 * var(--k)); height: calc(28 * var(--k)); display: flex; align-items: center; gap: calc(8 * var(--k)); font-size: calc(18 * var(--k)); font-weight: 400; color: #f1eff4; }
  .d-hello span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: calc(250 * var(--k)); }
  .d-hello svg { width: calc(10 * var(--k)); height: calc(18 * var(--k)); flex: none; stroke: #f1eff4; stroke-width: 1.5; }
  .d-arc { top: 0; left: 0; width: 100%; height: calc(200 * var(--k)); overflow: visible; pointer-events: none; }
  .d-pill { top: calc(103 * var(--k)); left: calc(12 * var(--k)); width: calc(143 * var(--k)); height: calc(42 * var(--k)); border-radius: 999px; background: rgba(104,92,114,.62); display: flex; align-items: center; gap: calc(10 * var(--k)); padding: 0 calc(8 * var(--k)) 0 calc(6 * var(--k)); text-align: left; }
  .d-pill .ring { position: relative; width: calc(31 * var(--k)); height: calc(31 * var(--k)); flex: none; display: grid; place-items: center; border-radius: 50%; background: rgba(255,255,255,.06); }
  .d-pill .ring svg.t { position: absolute; inset: 0; transform: rotate(-90deg); }
  .d-pill .ring svg.l { width: calc(15 * var(--k)); height: calc(15 * var(--k)); stroke: #ddd9e3; stroke-width: 1.6; }
  .d-pill small { display: block; font-size: calc(8.5 * var(--k)); color: #d9d5df; }
  .d-pill b { display: block; font-size: calc(14 * var(--k)); font-weight: 700; letter-spacing: .02em; font-variant-numeric: tabular-nums; margin-top: calc(1 * var(--k)); white-space: pre; }
  .d-pill .chev { margin-left: auto; width: calc(8 * var(--k)); height: calc(15 * var(--k)); stroke: #e9e6ee; stroke-width: 1.6; }

  .d-h { left: calc(12 * var(--k)); font-size: calc(13 * var(--k)); font-weight: 400; color: #eeebf2; line-height: calc(20 * var(--k)); }
  .d-hide { top: calc(171 * var(--k)); right: calc(12 * var(--k)); height: calc(20 * var(--k)); display: flex; align-items: center; gap: calc(5 * var(--k)); font-size: calc(10.5 * var(--k)); font-weight: 700; text-decoration: underline; text-underline-offset: calc(2 * var(--k)); color: #f1eff4 !important; padding: 0 !important; }
  .d-hide svg { width: calc(13 * var(--k)); height: calc(13 * var(--k)); stroke: #f1eff4; stroke-width: 1.3; text-decoration: none; }

  .d-acct { top: calc(207 * var(--k)); left: calc(12 * var(--k)); width: calc(262 * var(--k)); height: calc(118 * var(--k)); border-radius: calc(9 * var(--k)); background: #4a4152; }
  .d-acct h3 { position: absolute; left: calc(14 * var(--k)); top: calc(17 * var(--k)); font-size: calc(12.5 * var(--k)); font-weight: 700; }
  .d-acct p.n { position: absolute; left: calc(14 * var(--k)); top: calc(34 * var(--k)); font-size: calc(8.5 * var(--k)); color: #d9d5df; }

          <h3 class="d-h" style="top:calc(356 * var(--k))">Transacciones principales</h3>
          <div class="d-row" id="dRow"></div>
          <h3 class="d-h" style="top:calc(472 * var(--k))">Más opciones</h3>
          <div class="d-opts" id="dOpts"></div>
        </div></div>
        <button class="d-qr" type="button" aria-label="Escanear QR"></button>
        <nav class="d-nav" id="dNav" aria-label="Principal"></nav>
      </section>

      <div class="loader" id="loader" aria-hidden="true"><div class="spin"></div></div>

      <!-- ===== SPLASH ===== -->
      <section class="splash" id="splash" aria-label="Cargando">
        <svg class="swoosh" viewBox="0 0 368 728" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
          <path class="dash s-cyan"    pathLength="100" stroke="#2e3c43" stroke-width="17" d="M12 60 C 40 68, 74 86, 100 114"/>
          <path class="dash s-orange1" pathLength="100" stroke="#f2643a" stroke-width="26" d="M-10 30 C 12 36, 28 50, 36 74"/>
          <path class="dash s-yellow"  pathLength="100" stroke="#fdda24" stroke-width="22" d="M374 340 C 366 440, 332 510, 286 542"/>
          <path class="dash s-orange2" pathLength="100" stroke="#f2643a" stroke-width="26" d="M356 474 L 346 494"/>
          <path class="dash s-dot"     pathLength="100" stroke="#4bc6e2" stroke-width="17" d="M270 562 L 271 562.500" style="stroke-dasharray:0.01 400"/>
        </svg>

        <span class="logo"><svg viewBox="0 0 28 28" aria-hidden="true"><path d="M3 5.500c0-1.100.9-2 2-2h18.300c1.200 0 2 1 1.600 2.100l-.4 1c-.3.800-1 1.300-1.900 1.300H5c-1.100 0-2-.9-2-2zM3 12.200c0-1.100.9-2 2-2h18.300c1.200 0 2 1 1.600 2.100l-.4 1c-.3.800-1 1.300-1.900 1.300H5c-1.100 0-2-.9-2-2zM3 18.900c0-1.100.9-2 2-2h18.300c1.200 0 2 1 1.600 2.100l-.4 1c-.3.800-1 1.300-1.900 1.300H5c-1.100 0-2-.9-2-2z" transform="translate(0 1.500) skewX(-8)"/></svg>Bancolombia</span>
        <div class="pct" id="pct">0%</div>
      </section>
    </div>
  </div>
</div>

<script>
(function () {
  var splash = document.getElementById('splash');
  var home = document.getElementById('home');
  var pct = document.getElementById('pct');

  var h = new Date().getHours();
  document.getElementById('hello').textContent = h < 12 ? 'Buenos días' : h < 19 ? 'Buenas tardes' : 'Buenas noches';

  /* Contador de carga: arranca lento, acelera y se asienta al final */
  var DURATION = 2700, START = 450;
  var t0 = null;
  function ease(t) { return t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2; }
  function tick(ts) {
    if (t0 === null) t0 = ts;
    var t = Math.min(Math.max((ts - t0 - START) / DURATION, 0), 1);
    pct.textContent = Math.round(ease(t) * 100) + '%';
    if (t < 1) requestAnimationFrame(tick); else finish();
  }
  function finish() {
    setTimeout(function () {
      home.classList.add('in'); document.body.classList.add('ready');
      splash.classList.add('out');
      drawArc();
      setTimeout(function () { splash.style.display = 'none'; }, 700);
    }, 250);
  }
  requestAnimationFrame(tick);

  /* Arco de colores decorativo de la pantalla de inicio */
  function drawArc() {
    ['arcC', 'arcY', 'arcO'].forEach(function (id, i) {
      var p = document.getElementById(id);
      p.style.strokeDasharray = '100 100';
      p.style.strokeDashoffset = '100';
      p.style.transition = 'stroke-dashoffset .9s cubic-bezier(.3,.6,.2,1) ' + (.25 + i * .12) + 's';
      requestAnimationFrame(function () { requestAnimationFrame(function () { p.style.strokeDashoffset = '0'; }); });
    });
  }

  /* Clave dinámica: se renueva cada 30 s con anillo de cuenta regresiva */
  var code = document.getElementById('code'), timer = document.getElementById('timer');
  var CIRC = 150.8, PERIOD = 30000, born = Date.now();
  function newCode() {
    var n = String(Math.floor(Math.random() * 1000000)).padStart(6, '0');
    code.textContent = n.slice(0, 3) + ' ' + n.slice(3);
  }
  setInterval(function () {
    var e = (Date.now() - born) % PERIOD;
    if (e < 200 && Date.now() - born > 1000) newCode();
    timer.style.strokeDashoffset = String(CIRC * (e / PERIOD));
  }, 200);


  /* Pantalla de inicio de sesión */
  var auth = document.getElementById('auth'), user = document.getElementById('user'), go = document.getElementById('go');
  function openAuth() {
    auth.classList.add('open'); auth.setAttribute('aria-hidden', 'false'); home.classList.add('dim');
    setTimeout(function () { user.focus({ preventScroll: true }); }, 700);
  }
  function closeAuth() {
    auth.classList.remove('open'); auth.setAttribute('aria-hidden', 'true'); home.classList.remove('dim'); user.blur();
  }
  document.getElementById('openLogin').addEventListener('click', openAuth);
  document.getElementById('authClose').addEventListener('click', closeAuth);
  user.addEventListener('input', function () {
    var ok = user.value.trim().length > 0;
    go.classList.toggle('ready', ok); go.disabled = !ok;
  });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeAuth(); });

  /* ---- Cuenta: se arma clonando los iconos de la pantalla de inicio ---- */
  var dash = document.getElementById('dash'), loader = document.getElementById('loader');
  document.getElementById('dLogo').innerHTML = document.querySelector('.top .logo').innerHTML;
  document.querySelector('.d-qr').innerHTML = document.querySelector('.qr').innerHTML;
  var dRow = document.getElementById('dRow'), dOpts = document.getElementById('dOpts'), dNav = document.getElementById('dNav');
  document.querySelectorAll('.tx').forEach(function (b) { var c = document.createElement('button'); c.type = 'button'; c.innerHTML = b.innerHTML; dRow.appendChild(c); });
  document.querySelectorAll('.opt').forEach(function (b) { var c = document.createElement('button'); c.type = 'button'; c.innerHTML = b.innerHTML; dOpts.appendChild(c); });
  document.querySelectorAll('.nav button').forEach(function (b) { var c = document.createElement('button'); c.type = 'button'; c.className = b.className; c.innerHTML = b.innerHTML; dNav.appendChild(c); });
  dNav.querySelectorAll('button').forEach(function (b) {
    b.addEventListener('click', function () { dNav.querySelectorAll('button').forEach(function (x) { x.classList.remove('active'); }); b.classList.add('active'); });
  });

  /* Clave dinámica de la cuenta */
  var dCode = document.getElementById('dCode'), dTimer = document.getElementById('dTimer'), dBorn = Date.now();
  setInterval(function () {
    var e = (Date.now() - dBorn) % 30000;
    if (e < 200 && Date.now() - dBorn > 1000) { var n = String(Math.floor(Math.random() * 1000000)).padStart(6, '0'); dCode.textContent = n.slice(0, 3) + '  ' + n.slice(3); }
    dTimer.style.strokeDashoffset = String(87.96 * (e / 30000));
  }, 200);

  /* Ocultar saldos */
  var hidden = false;
  document.getElementById('hideBal').addEventListener('click', function () {
    hidden = !hidden;
    document.getElementById('bal').innerHTML = hidden ? '$ ••••••' : '$ 459<small>.33</small>';
    this.lastElementChild.textContent = hidden ? 'Mostrar saldos' : 'Ocultar saldos';
  });

  /* Carrusel de cuentas (puntos) */
  var dots = document.querySelectorAll('.d-dots i');
  document.querySelector('.d-next').addEventListener('click', function () { dots[0].classList.remove('on'); dots[1].classList.add('on'); });
  document.querySelector('.d-acct').addEventListener('click', function () { dots[1].classList.remove('on'); dots[0].classList.add('on'); });

  /* Continuar → círculo de carga con fondo desenfocado → cuenta */
  var busy = false;
  function login() {
    if (busy || !user.value.trim()) return;
    busy = true; user.blur();
    var name = user.value.trim();
    document.getElementById('dHello').textContent = 'Hola, ' + name;
    loader.classList.add('on'); loader.setAttribute('aria-hidden', 'false');
    setTimeout(function () {
      dash.classList.add('in'); dash.setAttribute('aria-hidden', 'false');
      setTimeout(function () { loader.classList.remove('on'); loader.setAttribute('aria-hidden', 'true'); busy = false; }, 250);
    }, 2300);
  }
  go.addEventListener('click', login);
  user.addEventListener('keydown', function (e) { if (e.key === 'Enter') login(); });
  document.getElementById('authNext').addEventListener('click', login);

  document.getElementById('logout').addEventListener('click', function () {
    dash.classList.remove('in'); dash.setAttribute('aria-hidden', 'true');
    closeAuth(); user.value = ''; go.classList.remove('ready'); go.disabled = true; hidden = false;
    document.getElementById('bal').innerHTML = '$ 459<small>.33</small>';
    document.querySelector('#hideBal span').textContent = 'Ocultar saldos';
  });

  /* Navegación inferior */
  var btns = document.querySelectorAll('.nav button');
  btns.forEach(function (b) {
    b.addEventListener('click', function () {
      btns.forEach(function (x) { x.classList.remove('active'); });
      b.classList.add('active');
    });
  });
})();
</script>
</body>
</html>
